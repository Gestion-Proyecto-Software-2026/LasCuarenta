openapi: 3.0.3
info:
  title: Cartas Online — Backend REST
  version: 0.1.0
  description: >
    API transaccional (cuentas, lobby, historial, ranking) del proyecto Cartas Online.
    El contrato detallado y las decisiones de producto viven en
    `docs/analisis_funcional_app.md` §5 — este documento es su traducción a OpenAPI
    para explorar y probar la API desde Swagger UI (`/api/docs`); si cambia un
    contrato se actualizan los dos en el mismo PR.
    Los endpoints marcados con ⚠️ **pendiente de implementar** responden hoy `501`.
servers:
  - url: http://localhost:3000/api
    description: Desarrollo local (npm run dev / docker compose)
tags:
  - name: Autenticación
    description: PBI-01
  - name: Lobby
    description: PBI-02, PBI-09
  - name: Historial y ranking
    description: PBI-06, PBI-07
  - name: Interno
    description: Solo lo llama el servidor de partida, nunca el cliente (secreto compartido)
  - name: Sistema

security: []

paths:
  /auth/registro:
    post:
      tags: [Autenticación]
      summary: Crea una cuenta nueva
      description: >
        `password_hash` es el SHA-256 de la contraseña en texto plano, en hexadecimal
        (64 caracteres), calculado por el cliente — el backend nunca recibe la
        contraseña en claro, y aplica además `bcrypt` sobre ese hash antes de guardarlo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroRequest"
            example:
              email: ana@example.com
              password_hash: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a1"
              nombre_visible: Ana
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "409":
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Inicia sesión y devuelve un JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/recuperar:
    post:
      tags: [Autenticación]
      summary: Solicita un código de recuperación de contraseña por correo
      description: >
        Responde siempre `200` con el mismo mensaje genérico, exista o no esa cuenta,
        para no filtrar qué correos están registrados. Si existe, genera un código
        numérico de 6 cifras (válido `RECOVERY_CODE_TTL_MIN` minutos, de un solo uso)
        y lo envía por correo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Mensaje genérico (exista o no el correo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
        "400":
          $ref: "#/components/responses/ErrorValidacion"

  /auth/restablecer:
    post:
      tags: [Autenticación]
      summary: Fija una contraseña nueva a partir del código de recuperación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestablecerRequest"
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
        "400":
          description: Datos inválidos, o código inválido/caducado/ya usado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /salas:
    get:
      tags: [Lobby]
      summary: Lista las salas en espera con plazas libres
      description: >
        Devuelve solo las salas en estado `esperando` con alguna plaza libre.
        Requiere token: todas las rutas de lobby exigen autenticación.
      security:
        - bearerAuth: []
      parameters:
        - name: juego
          in: query
          required: false
          description: Filtra por juego. Si se omite, devuelve salas de todos los juegos.
          schema:
            $ref: "#/components/schemas/Juego"
      responses:
        "200":
          description: Salas disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sala"
              example:
                - id: 11111111-1111-4111-8111-111111111111
                  juego: guinote
                  estado: esperando
                  nombre: Partida rápida
                  tiene_contrasena: false
                  jugadores_actuales: 2
                  jugadores:
                    - usuario_id: 22222222-2222-4222-8222-222222222222
                      nombre_visible: Ana
                      posicion: 0
                  capacidad: 4
                  creador_id: 22222222-2222-4222-8222-222222222222
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [Lobby]
      summary: Crea una sala y sienta al creador
      description: >
        Sienta al usuario autenticado en la posición 0. Se admite `guinote` o `mus`
        (tute devuelve 400 hasta tener motor). `capacidad` es 2 o 4 (4 por defecto si
        se omite); ambos juegos admiten las dos. `nombre` es libre (1 a 40 caracteres,
        "Sala de Guiñote" por defecto); `password_hash` es opcional y, si se manda,
        protege la sala (debe coincidir al unirse, ver `POST /salas/{id}/unirse`).
        La respuesta incluye `servidor_direccion`, que el cliente usará cuando la sala se complete.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [juego]
              properties:
                juego:
                  type: string
                  enum: [guinote, mus]
                capacidad:
                  type: integer
                  enum: [2, 4]
                  default: 4
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 40
                  default: Sala de Guiñote
                password_hash:
                  type: string
                  description: SHA-256 en hexadecimal (64 caracteres) de la contraseña de la sala; el cliente nunca manda la contraseña en claro.
            example:
              juego: guinote
              capacidad: 2
              nombre: Partida rápida
      responses:
        "201":
          description: Sala creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaCreada"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /salas/{id}/unirse:
    post:
      tags: [Lobby]
      summary: Sienta al usuario autenticado en la primera plaza libre de una sala
      description: >
        La sala debe estar en `esperando`, el usuario no puede estar ya sentado en ella
        y debe quedar al menos una plaza libre. La operación es transaccional y bloquea
        la fila de la sala, así que dos uniones simultáneas no pueden ocupar la misma plaza.
        La respuesta incluye `servidor_direccion` para que quien se une también pueda
        conectar por ENet, igual que a quien crea la sala. Si la sala tiene contraseña,
        el body debe incluir `password_hash` (el mismo SHA-256 de 64 caracteres hex que
        calcula el cliente; nunca viaja en claro) coincidiendo con el de la sala.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SalaId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password_hash:
                  type: string
                  description: Solo necesario si la sala tiene contraseña.
      responses:
        "200":
          description: Usuario sentado; devuelve la sala con el recuento actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sala"
        "400":
          description: El id no es un UUID válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          description: La sala tiene contraseña y no coincide (o no se mandó)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La sala no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Conflicto: la sala no está en espera, el usuario ya está sentado en ella,
            o la sala está llena.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                llena:
                  value:
                    error: la sala está llena
                ya_unido:
                  value:
                    error: ya estás en esta sala
                no_admite:
                  value:
                    error: la sala no admite nuevos jugadores
    delete:
      tags: [Lobby]
      summary: Abandona una sala en espera
      description: >
        Quita al usuario autenticado de `sala_participantes`. Si tras salir no queda
        nadie en la sala, esta se borra entera (evita salas fantasma abandonadas). Solo
        se puede abandonar una sala en `esperando`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SalaId"
      responses:
        "204":
          description: Abandonada (sin cuerpo)
        "400":
          description: El id no es un UUID válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: La sala no existe, o el usuario no es participante de ella
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La sala ya no está en espera (partida en curso o finalizada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /salas/{id}/expulsar:
    post:
      tags: [Lobby]
      summary: Expulsa a un jugador de la sala (solo el creador)
      description: "⚠️ Pendiente de implementar (responde 501). PBI-09."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SalaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario_id]
              properties:
                usuario_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Jugador expulsado

  /usuarios/{id}/historial:
    get:
      tags: [Historial y ranking]
      summary: Historial de partidas terminadas de un usuario
      description: >
        Partidas terminadas del usuario, de la más reciente a la más antigua
        (`fecha_fin` descendente, desempate por `partida_id` descendente). `id` puede
        ser `me` (el usuario del token). El historial es público por defecto; si su
        titular lo ha hecho privado (`PUT /usuarios/me/privacidad`), solo lo ve él
        (los demás reciben `403`). PBI-06.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
        - name: juego
          in: query
          required: false
          description: Solo las partidas de ese juego. Si se omite (o va vacío), de todos.
          schema:
            $ref: "#/components/schemas/Juego"
        - name: limite
          in: query
          required: false
          description: Número máximo de partidas (de 1 a 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Partidas del usuario, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistorialPartida"
        "400":
          description: El id no es `me` ni un UUID, o `juego` o `limite` no son válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                id:
                  value:
                    error: id de usuario no válido
                juego:
                  value:
                    error: "juego no válido, valores admitidos: guinote, mus, tute"
                limite:
                  value:
                    error: limite no válido (entero de 1 a 500)
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/HistorialPrivado"
        "404":
          $ref: "#/components/responses/UsuarioNoExiste"

  /usuarios/{id}/estadisticas:
    get:
      tags: [Historial y ranking]
      summary: Estadísticas de rendimiento de un usuario
      description: >
        Totales, desglose por juego (siempre los tres, en el orden guinote, mus,
        tute, aunque sea con ceros), porcentaje de victorias redondeado a 1 decimal,
        racha actual, mejor racha de victorias y los 10 últimos resultados (del más
        reciente al más antiguo). `id` puede ser `me`. Mismo control de acceso que
        el historial. PBI-06.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
      responses:
        "200":
          description: Estadísticas del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estadisticas"
        "400":
          description: El id no es `me` ni un UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: id de usuario no válido
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/HistorialPrivado"
        "404":
          $ref: "#/components/responses/UsuarioNoExiste"

  /usuarios/me/privacidad:
    get:
      tags: [Historial y ranking]
      summary: Si el historial del usuario autenticado es público
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Privacidad actual del historial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Privacidad"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/UsuarioNoExiste"
    put:
      tags: [Historial y ranking]
      summary: Hace público o privado el historial del usuario autenticado
      description: >
        Solo el titular decide sobre su historial. Con `historial_publico: false`,
        su historial y sus estadísticas solo los ve él; los demás reciben `403`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Privacidad"
            example:
              historial_publico: false
      responses:
        "200":
          description: Privacidad guardada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Privacidad"
        "400":
          description: historial_publico no es un booleano
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: historial_publico tiene que ser true o false
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/UsuarioNoExiste"

  /ranking:
    get:
      tags: [Historial y ranking]
      summary: Ranking agregado por juego
      description: "⚠️ Pendiente de implementar (responde 501). PBI-07."
      security: []
      parameters:
        - name: juego
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Juego"
      responses:
        "200":
          description: Clasificación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankingEntrada"

  /interno/salas/{id}:
    get:
      tags: [Interno]
      summary: Composición de una sala (solo el servidor de partida)
      description: >
        `equipo` se calcula como `posicion % 2` (no depende de que
        `sala_participantes.equipo` esté relleno).
      security:
        - internalSecret: []
      parameters:
        - $ref: "#/components/parameters/SalaId"
      responses:
        "200":
          description: Sala encontrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Sala"
                  - type: object
                    properties:
                      participantes:
                        type: array
                        items:
                          $ref: "#/components/schemas/Participante"
        "401":
          description: X-Internal-Secret ausente o incorrecto
        "404":
          description: La sala no existe

  /interno/partidas:
    post:
      tags: [Interno]
      summary: Persiste el resultado final de una partida (solo el servidor de partida)
      description: >
        Rellena `partidas` (+ `resultado_json`, `causa` y las fechas reales) y
        `partida_jugadores` (`posicion`, `gano = equipo == resultado.equipo_ganador`,
        `puntos_obtenidos = resultado.puntos_por_equipo[equipo]`), y pasa la sala a
        `finalizada`. Todo en una transacción. Todo el body se valida antes de tocar
        la base de datos. Es idempotente: una sala aloja una sola partida, así que si
        el servidor de partida reintenta el registro, la segunda llamada responde
        `409` sin duplicar nada (el servidor de partida lo da por bueno).
      security:
        - internalSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultadoPartidaRequest"
            example:
              sala_id: 11111111-1111-4111-8111-111111111111
              jugadores:
                - usuario_id: 22222222-2222-4222-8222-222222222222
                  posicion: 0
                  equipo: 0
                - usuario_id: 33333333-3333-4333-8333-333333333333
                  posicion: 1
                  equipo: 1
              resultado:
                equipo_ganador: 0
                puntos_por_equipo: [105, 52]
                causa: completa
                motivo: tantos
              fecha_inicio: "2026-11-18T10:00:00Z"
              fecha_fin: "2026-11-18T10:24:13Z"
      responses:
        "201":
          description: Resultado registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          description: >
            Body mal formado (sala_id o algún usuario_id que no es un UUID, posicion
            fuera de 0-3, equipo que no es 0 ni 1, jugadores o posiciones repetidos,
            equipo_ganador, puntos_por_equipo o causa no válidos, algún texto de
            resultado con \u0000 o UTF-16 mal formado, fechas que no son ISO 8601 con
            zona horaria o cuyo año en UTC se sale de 1-9999, o fecha_inicio posterior
            a fecha_fin), o algún usuario_id que no corresponde a ninguna cuenta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: usuario_id de jugador no válido
        "401":
          description: X-Internal-Secret ausente o incorrecto
        "404":
          description: La sala no existe
        "409":
          description: La partida de esta sala ya estaba registrada (p. ej. un reintento)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: la partida de esta sala ya está registrada

  /health:
    get:
      tags: [Sistema]
      summary: Comprobación de salud del backend
      security: []
      responses:
        "200":
          description: El backend está operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token devuelto por POST /auth/login, firmado con JWT_SECRET
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: Secreto servidor-a-servidor (INTERNAL_API_SECRET), nunca lo usa el cliente

  parameters:
    SalaId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UsuarioId:
      name: id
      in: path
      required: true
      description: UUID del usuario, o `me` para el usuario del token.
      schema:
        type: string
        example: me

  responses:
    ErrorValidacion:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoAutenticado:
      description: Falta el token o no es válido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: no autenticado
    HistorialPrivado:
      description: El historial es de otro usuario y lo tiene en privado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: este historial es privado
    UsuarioNoExiste:
      description: El usuario no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: el usuario no existe

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      example:
        error: email inválido

    Mensaje:
      type: object
      properties:
        mensaje:
          type: string

    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nombre_visible:
          type: string

    RegistroRequest:
      type: object
      required: [email, password_hash, nombre_visible]
      properties:
        email:
          type: string
          format: email
        password_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256 de la contraseña en claro, en hexadecimal
        nombre_visible:
          type: string

    LoginRequest:
      type: object
      required: [email, password_hash]
      properties:
        email:
          type: string
          format: email
        password_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/Usuario"

    RestablecerRequest:
      type: object
      required: [email, codigo, password_hash]
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          pattern: "^[0-9]{6}$"
          description: Código de 6 cifras recibido por correo
        password_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"

    Juego:
      type: string
      enum: [guinote, mus, tute]

    Sala:
      type: object
      required: [id, juego, estado, capacidad, jugadores_actuales, creador_id]
      properties:
        id:
          type: string
          format: uuid
        juego:
          $ref: "#/components/schemas/Juego"
        estado:
          type: string
          enum: [esperando, en_curso, finalizada]
        capacidad:
          type: integer
          example: 4
        jugadores_actuales:
          type: integer
          example: 2
        creador_id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Partida rápida
        tiene_contrasena:
          type: boolean
          description: Si es true, hace falta `password_hash` para unirse. Nunca se expone el hash.
        servidor_direccion:
          type: string
          description: >
            host:puerto del servidor de partida (GAME_SERVER_ADDRESS). Presente en la
            respuesta de POST /salas/{id}/unirse, no en el listado de GET /salas.
          example: localhost:9000
        jugadores:
          type: array
          description: >
            Participantes actuales de la sala, en orden de posición. Solo presente en
            el listado de GET /salas (para mostrar quién hay antes de unirse).
          items:
            type: object
            required: [usuario_id, nombre_visible, posicion]
            properties:
              usuario_id:
                type: string
                format: uuid
              nombre_visible:
                type: string
              posicion:
                type: integer
          example:
            - usuario_id: 22222222-2222-4222-8222-222222222222
              nombre_visible: Ana
              posicion: 0

    SalaCreada:
      type: object
      description: Respuesta de POST /salas. No incluye el recuento de jugadores.
      required: [id, juego, estado, capacidad, servidor_direccion]
      properties:
        id:
          type: string
          format: uuid
        juego:
          $ref: "#/components/schemas/Juego"
        estado:
          type: string
          enum: [esperando]
        capacidad:
          type: integer
          example: 4
        nombre:
          type: string
          example: Partida rápida
        tiene_contrasena:
          type: boolean
        servidor_direccion:
          type: string
          description: host:puerto del servidor de partida (GAME_SERVER_ADDRESS)
          example: localhost:9000

    Participante:
      type: object
      properties:
        usuario_id:
          type: string
          format: uuid
        posicion:
          type: integer
        equipo:
          type: integer
          nullable: true

    JugadorHistorial:
      type: object
      properties:
        usuario_id:
          type: string
          format: uuid
        nombre_visible:
          type: string
        posicion:
          type: integer
          nullable: true
          description: Asiento en la mesa (null en partidas registradas antes de guardarlo).

    HistorialPartida:
      type: object
      properties:
        partida_id:
          type: string
          format: uuid
        sala_id:
          type: string
          format: uuid
        juego:
          $ref: "#/components/schemas/Juego"
        num_jugadores:
          type: integer
          example: 4
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
        resultado:
          type: string
          enum: [victoria, derrota]
        gano:
          type: boolean
        causa:
          $ref: "#/components/schemas/CausaFin"
        motivo:
          type: string
          nullable: true
          description: >
            Cómo se ganó según el motor (`resultado.motivo`): en Guiñote y Tute
            `tute`, `tantos`, `vuelta` o `capote`; null en el Mus.
        equipo:
          type: integer
          enum: [0, 1]
        puntos_equipo:
          type: integer
          description: Tantos del equipo del usuario (en el Mus, juegos ganados).
        puntos_rival:
          type: integer
          description: Tantos del equipo rival (en el Mus, juegos ganados); 0 si no hay.
        companeros:
          type: array
          description: Los demás jugadores de su equipo, por posición (vacío a 2 jugadores).
          items:
            $ref: "#/components/schemas/JugadorHistorial"
        rivales:
          type: array
          description: Los jugadores del otro equipo, por posición.
          items:
            $ref: "#/components/schemas/JugadorHistorial"
      example:
        partida_id: 66666666-6666-4666-8666-666666666666
        sala_id: 11111111-1111-4111-8111-111111111111
        juego: guinote
        num_jugadores: 4
        fecha_inicio: "2026-11-18T10:00:00.000Z"
        fecha_fin: "2026-11-18T10:24:13.000Z"
        resultado: victoria
        gano: true
        causa: completa
        motivo: tantos
        equipo: 0
        puntos_equipo: 105
        puntos_rival: 52
        companeros:
          - usuario_id: 44444444-4444-4444-8444-444444444444
            nombre_visible: Marta
            posicion: 2
        rivales:
          - usuario_id: 33333333-3333-4333-8333-333333333333
            nombre_visible: Luis
            posicion: 1
          - usuario_id: 55555555-5555-4555-8555-555555555555
            nombre_visible: Pepe
            posicion: 3

    CausaFin:
      type: string
      enum: [completa, renuncio]
      description: >
        Por qué terminó la partida: `completa` (se jugó hasta el final) o `renuncio`
        (renuncio admitido en el chat, PBI-08).

    ResumenResultados:
      type: object
      properties:
        jugadas:
          type: integer
        victorias:
          type: integer
        derrotas:
          type: integer
        porcentaje_victorias:
          type: number
          description: Redondeado a 1 decimal; 0 si no hay partidas.
          example: 58.3

    Estadisticas:
      type: object
      properties:
        usuario_id:
          type: string
          format: uuid
        nombre_visible:
          type: string
        historial_publico:
          type: boolean
        totales:
          $ref: "#/components/schemas/ResumenResultados"
        por_juego:
          type: array
          description: Siempre los tres juegos, en este orden, aunque sea con ceros.
          items:
            allOf:
              - type: object
                properties:
                  juego:
                    $ref: "#/components/schemas/Juego"
              - $ref: "#/components/schemas/ResumenResultados"
        racha_actual:
          type: object
          description: Resultados iguales seguidos empezando por la partida más reciente.
          properties:
            tipo:
              type: string
              enum: [victoria, derrota]
              nullable: true
              description: null si no hay partidas.
            partidas:
              type: integer
        mejor_racha_victorias:
          type: integer
          description: La serie más larga de victorias seguidas.
        ultimos_resultados:
          type: array
          description: Hasta 10, del más reciente al más antiguo.
          items:
            type: string
            enum: [victoria, derrota]
      example:
        usuario_id: 22222222-2222-4222-8222-222222222222
        nombre_visible: Ana
        historial_publico: true
        totales:
          jugadas: 12
          victorias: 7
          derrotas: 5
          porcentaje_victorias: 58.3
        por_juego:
          - juego: guinote
            jugadas: 8
            victorias: 5
            derrotas: 3
            porcentaje_victorias: 62.5
          - juego: mus
            jugadas: 4
            victorias: 2
            derrotas: 2
            porcentaje_victorias: 50
          - juego: tute
            jugadas: 0
            victorias: 0
            derrotas: 0
            porcentaje_victorias: 0
        racha_actual:
          tipo: victoria
          partidas: 3
        mejor_racha_victorias: 4
        ultimos_resultados:
          - victoria
          - victoria
          - victoria
          - derrota
          - victoria
          - victoria
          - victoria
          - victoria
          - derrota
          - derrota

    Privacidad:
      type: object
      required: [historial_publico]
      properties:
        historial_publico:
          type: boolean
          description: Si es false, el historial y las estadísticas solo los ve su titular.

    RankingEntrada:
      type: object
      properties:
        usuario_id:
          type: string
          format: uuid
        nombre_visible:
          type: string
        puntos_totales:
          type: integer
        posicion:
          type: integer

    JugadorResultado:
      type: object
      required: [usuario_id, posicion, equipo]
      properties:
        usuario_id:
          type: string
          format: uuid
        posicion:
          type: integer
          minimum: 0
          maximum: 3
        equipo:
          type: integer
          enum: [0, 1]

    ResultadoPartidaRequest:
      type: object
      required: [sala_id, jugadores, resultado]
      properties:
        sala_id:
          type: string
          format: uuid
        jugadores:
          type: array
          minItems: 1
          description: Sin usuario_id ni posiciones repetidos.
          items:
            $ref: "#/components/schemas/JugadorResultado"
        resultado:
          type: object
          description: >
            Lo que devuelve calcular_resultado del motor de reglas, más la causa. Se
            guarda entero en `resultado_json`, con lo que añada cada motor (p. ej. `motivo`).
            Ningún texto ni clave puede llevar \u0000 ni UTF-16 mal formado (JSONB no los admite).
          required: [equipo_ganador]
          properties:
            equipo_ganador:
              type: integer
              enum: [0, 1]
            puntos_por_equipo:
              type: array
              description: Tantos (en el Mus, juegos ganados) de cada equipo; 0 a cada jugador si se omite.
              minItems: 2
              maxItems: 2
              items:
                type: integer
                minimum: 0
            causa:
              allOf:
                - $ref: "#/components/schemas/CausaFin"
              default: completa
          additionalProperties: true
        fecha_inicio:
          type: string
          format: date-time
          description: ISO 8601 con zona horaria y año de 1 a 9999 en UTC. Si se omite, la misma que fecha_fin.
        fecha_fin:
          type: string
          format: date-time
          description: ISO 8601 con zona horaria y año de 1 a 9999 en UTC, no anterior a fecha_inicio. Si se omite, la hora del registro.
