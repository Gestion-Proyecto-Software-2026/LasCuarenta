; Presets de exportación del cliente (PBI-13). Los usa el workflow
; godot-release.yml y también se pueden usar en local (README, sección 11).
; El cliente exportado NO incluye el servidor de partida, los tests ni GUT:
; el servidor se ejecuta desde el proyecto con godot --headless (arquitectura.md §3).
; embed_pck=true: un único fichero ejecutable, sin .pck al lado.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_path="../build/cartas-online-windows.exe"
export_filter="all_resources"
include_filter=""
exclude_filter="server/*, tests/*, addons/gut/*, .gutconfig.json, Dockerfile, .dockerignore"

[preset.0.options]

binary_format/embed_pck=true
application/product_name="Cartas Online"
application/file_description="Cartas Online: Guiñote, Mus y Tute"
application/company_name="LasCuarenta"


[preset.1]

name="Linux"
platform="Linux"
runnable=true
export_path="../build/cartas-online-linux.x86_64"
export_filter="all_resources"
include_filter=""
exclude_filter="server/*, tests/*, addons/gut/*, .gutconfig.json, Dockerfile, .dockerignore"

[preset.1.options]

binary_format/embed_pck=true
