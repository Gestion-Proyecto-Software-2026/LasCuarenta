; Export presets — PUNTO DE PARTIDA, no un archivo final.
; La primera persona que exporte debe completarlo/regenerarlo desde
; el editor (Proyecto > Exportar), con los export templates instalados.
; El cliente exportado no incluye el servidor de partida, los tests ni GUT:
; el servidor se ejecuta desde el proyecto con godot --headless (arquitectura.md §3).

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_path="../build/cartas-online-windows.exe"
export_filter="all_resources"
include_filter=""
exclude_filter="server/*, tests/*, addons/gut/*, .gutconfig.json"

[preset.0.options]

binary_format/embed_pck=false


[preset.1]

name="Linux"
platform="Linux"
runnable=true
export_path="../build/cartas-online-linux.x86_64"
export_filter="all_resources"
include_filter=""
exclude_filter="server/*, tests/*, addons/gut/*, .gutconfig.json"

[preset.1.options]

binary_format/embed_pck=false
