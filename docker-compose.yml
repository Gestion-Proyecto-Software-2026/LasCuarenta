services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cartas
      POSTGRES_PASSWORD: cartas_dev_password
      POSTGRES_DB: cartas_online
    volumes:
      - db_data:/var/lib/postgresql/data
      # PostgreSQL ejecuta estos scripts solo al crear la base de datos (volumen
      # vacío). Con un volumen ya creado, las migraciones nuevas se aplican a mano.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://cartas:cartas_dev_password@db:5432/cartas_online
      JWT_SECRET: cambia_esto_en_produccion
      # Secreto servidor-a-servidor para POST /interno/partidas — lo debe conocer
      # también el servidor de partida (mismo valor que game-server, abajo).
      INTERNAL_API_SECRET: cambia_esto_tambien_en_produccion
      # Dirección del servidor de partida que se entrega al cliente como servidor_direccion.
      # El cliente se conecta por ENet/UDP directamente a esta dirección (no pasa por nginx).
      GAME_SERVER_ADDRESS: localhost:9000
      PORT: 3000
      BCRYPT_SALT_ROUNDS: 10
      JWT_EXPIRES_IN: 24h
      # SMTP de pruebas para POST /auth/recuperar (ver backend/.env.example).
      # Sustituid por un SMTP real (o uno de pruebas como Mailtrap/Ethereal) para probar el envío.
      SMTP_HOST: localhost
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_FROM: no-reply@cartas-online.local
      RECOVERY_CODE_TTL_MIN: 15
    ports:
      - "3000:3000"

  game-server:
    build: ./game
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Mismos valores que `backend`, arriba: el servidor de partida verifica el
      # JWT por su cuenta y autentica sus llamadas a /api/interno/* con el mismo
      # secreto (docs/arquitectura.md §5).
      JWT_SECRET: cambia_esto_en_produccion
      INTERNAL_API_SECRET: cambia_esto_tambien_en_produccion
      BACKEND_URL: http://backend:3000/api
    ports:
      - "9000:9000/udp"

volumes:
  db_data:
