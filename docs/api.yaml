openapi: 3.0.3
info:
  title: Cartas Online API
  version: "0.1.0"
  description: API REST del backend transaccional. Ver docs/analisis_funcional_app.md §5.
servers:
  - url: /api
paths:
  /auth/registro:
    post:
      summary: Crear una cuenta de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, nombre_visible]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                nombre_visible: { type: string }
      responses:
        "201": { description: Usuario creado }
  /auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: "Token de sesión (JWT) + datos del usuario" }
  /salas:
    get:
      summary: Listar salas disponibles
      parameters:
        - name: juego
          in: query
          schema: { type: string, enum: [guinote, mus, tute] }
      responses:
        "200": { description: Lista de salas }
    post:
      summary: Crear una sala
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [juego]
              properties:
                juego: { type: string, enum: [guinote, mus, tute] }
      responses:
        "201": { description: "Sala creada, incluye servidor_direccion (host:puerto)" }
  /salas/{id}/unirse:
    post:
      summary: Unirse a una sala existente
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Sala actualizada }
  /salas/{id}/expulsar:
    post:
      summary: Expulsar a un jugador de una sala (solo el creador) — PBI-09
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                usuario_id: { type: string }
      responses:
        "200": { description: Jugador expulsado }
  /usuarios/{id}/historial:
    get:
      summary: Historial de partidas de un usuario — PBI-06
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Lista de partidas jugadas }
  /ranking:
    get:
      summary: Ranking de jugadores — PBI-07
      parameters:
        - name: juego
          in: query
          schema: { type: string }
      responses:
        "200": { description: Clasificación de jugadores }
  /interno/salas/{id}:
    get:
      summary: (Interno) Composición de una sala para el servidor de partida
      description: Solo lo invoca el servidor de partida, con la cabecera X-Internal-Secret. Ver analisis_funcional_app.md §5 y §6.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Internal-Secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sala y participantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  juego: { type: string, enum: [guinote, mus, tute] }
                  estado: { type: string, enum: [esperando, en_curso, finalizada] }
                  capacidad: { type: integer }
                  participantes:
                    type: array
                    items:
                      type: object
                      properties:
                        usuario_id: { type: string, format: uuid }
                        posicion: { type: integer, minimum: 0, maximum: 3 }
                        equipo: { type: integer, nullable: true }
        "401": { description: Falta la cabecera X-Internal-Secret o no coincide }
        "404": { description: La sala no existe }
  /interno/partidas:
    post:
      summary: (Interno) Registrar el resultado de una partida terminada
      description: Solo lo invoca el servidor de partida, nunca el cliente. Ver analisis_funcional_app.md §5.
      parameters:
        - name: X-Internal-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sala_id, jugadores, resultado]
              properties:
                sala_id: { type: string, format: uuid }
                jugadores:
                  type: array
                  items:
                    type: object
                    properties:
                      usuario_id: { type: string, format: uuid }
                      posicion: { type: integer, minimum: 0, maximum: 3 }
                      equipo: { type: integer }
                resultado:
                  type: object
                  required: [equipo_ganador, puntos_por_equipo]
                  properties:
                    equipo_ganador: { type: integer }
                    puntos_por_equipo: { type: array, items: { type: integer } }
                  additionalProperties: true
      responses:
        "201": { description: Resultado guardado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
