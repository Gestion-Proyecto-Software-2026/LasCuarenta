name: Build and release client

# Se dispara al crear un tag (p. ej. v0.1.0). Requiere tener
# configurados los export presets (game/export_presets.cfg) y,
# para firmar en Windows, los secretos correspondientes.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
      - name: Export Windows build
        working-directory: game
        run: godot --headless --export-release "Windows Desktop" ../build/cartas-online-windows.exe
      - name: Export Linux build
        working-directory: game
        run: godot --headless --export-release "Linux" ../build/cartas-online-linux.x86_64
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
