name: Godot CI

on:
  pull_request:
    paths: ["game/**"]
  push:
    branches: [main]
    paths: ["game/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          # Godot estándar, sin .NET: el proyecto es solo GDScript.
          use-dotnet: false
      # Sin importar antes, GUT no encuentra sus clases (ni el autoload por uid),
      # no ejecuta ningún test y aun así termina con éxito.
      - name: Import project
        working-directory: game
        run: godot --headless --import
      # Requiere tener el addon GUT instalado en game/addons/gut
      - name: Run GUT tests (headless)
        working-directory: game
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd
